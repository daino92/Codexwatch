<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">CodexWatch menu bar preview</title>
  <desc id="description">Illustrative macOS desktop showing the CodexWatch menu bar label and a popover with 5-hour, Weekly, and Luna Reserve quotas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="0.58" stop-color="#233555"/>
      <stop offset="1" stop-color="#425770"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ad4ec" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9ad4ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#06101e" flood-opacity="0.42"/>
    </filter>
    <clipPath id="panelClip"><rect x="756" y="124" width="422" height="490" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <circle cx="944" cy="347" r="460" fill="url(#glow)"/>
  <path d="M0 547 C273 413 385 688 640 549 S1001 506 1280 603 V720 H0Z" fill="#93b4c8" opacity="0.07"/>

  <rect x="0" y="0" width="1280" height="47" fill="#0b1323" opacity="0.78"/>
  <text x="42" y="31" fill="#f7f8fa" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">⌘</text>
  <text x="83" y="30" fill="#f7f8fa" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">CodexWatch</text>
  <rect x="944" y="7" width="233" height="33" rx="8" fill="#ffffff" opacity="0.15"/>
  <text x="959" y="29" fill="#ffffff" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">⌘  5h 68%  ·  W 34%</text>

  <rect x="83" y="165" width="54" height="54" rx="14" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="97" y="201" fill="#ffffff" font-size="31" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">⌘</text>
  <text x="83" y="290" fill="#ffffff" font-size="57" font-weight="700" letter-spacing="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">CodexWatch</text>
  <text x="86" y="345" fill="#d8e5ef" font-size="24" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Codex usage in your menu bar.</text>
  <rect x="85" y="388" width="63" height="3" rx="1.5" fill="#82d6bd"/>
  <text x="86" y="439" fill="#c8d6e4" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">5-hour  ·  Weekly  ·  Luna Reserve</text>
  <text x="86" y="474" fill="#c8d6e4" font-size="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Local data from codex app-server</text>

  <g filter="url(#shadow)">
    <rect x="756" y="124" width="422" height="490" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.8"/>
  </g>
  <g clip-path="url(#panelClip)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="780" y="166" fill="#1d2734" font-size="19" font-weight="700">CodexWatch</text>
    <text x="780" y="188" fill="#677281" font-size="13">Codex CLI usage</text>
    <circle cx="787" cy="207" r="5" fill="#39ad73"/>
    <text x="800" y="212" fill="#319463" font-size="12">Connected</text>
    <text x="1129" y="172" fill="#617081" font-size="23">↻</text>

    <text x="790" y="262" fill="#27313d" font-size="16" font-weight="600">5-hour</text>
    <text x="1142" y="262" fill="#27313d" font-size="13" text-anchor="end">68% left</text>
    <text x="1158" y="262" fill="#a5afbb" font-size="17">›</text>
    <rect x="790" y="277" width="350" height="6" rx="3" fill="#d9dfe6"/>
    <rect x="790" y="277" width="238" height="6" rx="3" fill="#3288e3"/>
    <text x="790" y="306" fill="#77818e" font-size="12">Resets in 2h 18m</text>

    <text x="790" y="357" fill="#27313d" font-size="16" font-weight="600">Weekly</text>
    <text x="1142" y="357" fill="#27313d" font-size="13" text-anchor="end">34% left</text>
    <text x="1158" y="357" fill="#a5afbb" font-size="17">›</text>
    <rect x="790" y="372" width="350" height="6" rx="3" fill="#d9dfe6"/>
    <rect x="790" y="372" width="119" height="6" rx="3" fill="#3288e3"/>
    <text x="790" y="401" fill="#77818e" font-size="12">Resets in 3d 7h</text>

    <text x="790" y="452" fill="#27313d" font-size="16" font-weight="600">Luna Reserve</text>
    <text x="1142" y="452" fill="#27313d" font-size="13" text-anchor="end">91% left</text>
    <text x="1158" y="452" fill="#a5afbb" font-size="17">›</text>
    <rect x="790" y="467" width="350" height="6" rx="3" fill="#d9dfe6"/>
    <rect x="790" y="467" width="319" height="6" rx="3" fill="#3288e3"/>
    <text x="790" y="496" fill="#77818e" font-size="12">Resets in 6d 12h</text>

    <path d="M780 538 H1154" stroke="#d7dde3"/>
    <text x="780" y="570" fill="#8b95a0" font-size="12">Updated just now</text>
    <text x="1088" y="571" fill="#667384" font-size="20">⚙</text>
    <text x="1130" y="570" fill="#3c4652" font-size="13">Quit</text>
  </g>
</svg>
